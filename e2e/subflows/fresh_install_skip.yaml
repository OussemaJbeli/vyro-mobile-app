# Fresh install, onboarding skipped: lands on Home with the default routine applied.
appId: ca.evoxai.vyro
---
- launchApp:
    clearState: true
- tapOn:
    id: welcome-start
- repeat:
    while:
      visible:
        id: onboarding-skip
    commands:
      - tapOn:
          id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 15000
